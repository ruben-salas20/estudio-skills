<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="escenas-3d" content="laboratorio">
<title>Cómo un río rehace su valle</title>
<style>
  /* Variables de interfaz por tema. Los colores 3D (--c-*) los escribe el guion desde TEMAS. */
  body[data-tema=oscuro] {
    --fondo: #16181d; --panel: rgba(27, 30, 37, .84); --borde: rgba(255, 255, 255, .13);
    --texto: #e9ecf1; --tenue: #a0aab8; --acento: #6db1ff; --sobre-acento: #071220;
    --boton: rgba(255, 255, 255, .07); --boton-hover: rgba(255, 255, 255, .14);
  }
  body[data-tema=claro] {
    --fondo: #eceef1; --panel: rgba(255, 255, 255, .84); --borde: rgba(0, 0, 0, .15);
    --texto: #1c2128; --tenue: #56606d; --acento: #1d6bd1; --sobre-acento: #ffffff;
    --boton: rgba(0, 0, 0, .05); --boton-hover: rgba(0, 0, 0, .11);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--fondo); color: var(--texto);
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  #lienzo { position: fixed; inset: 0; }
  #lienzo canvas { display: block; }
  [hidden] { display: none !important; }

  .tarjeta {
    background: var(--panel); border: 1px solid var(--borde); border-radius: 12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .rotulo {
    font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
    color: var(--tenue);
  }
  .num { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* Etiquetas 3D: texto en color de tinta (contraste AA en ambos temas); el color semántico va en el borde. */
  #etiquetas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .etiqueta {
    padding: 2px 8px; border-radius: 6px; white-space: nowrap;
    background: var(--panel); border: 1px solid var(--borde); border-left: 3px solid var(--tenue);
    color: var(--texto); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums;
    transition: opacity .18s;
  }
  /* Tapada por resolverEtiquetas(). */
  .etiqueta.tapada { opacity: 0; }
  body[data-captura] .etiqueta { transition: none; }   /* la captura no espera a un fundido */
  .etiqueta.azul { border-left-color: var(--c-azul); }
  .etiqueta.naranja { border-left-color: var(--c-naranja); }
  .etiqueta.verde { border-left-color: var(--c-verde); }
  .etiqueta.rojo { border-left-color: var(--c-rojo); }
  .etiqueta.amarillo { border-left-color: var(--c-amarillo); }
  .etiqueta.violeta { border-left-color: var(--c-violeta); }
  .etiqueta.gris { border-left-color: var(--c-gris); }
  body[data-formato=compacto] .etiqueta { font-size: 10.5px; padding: 1px 5px; border-left-width: 2px; }
  /* opcional: true → fuera en compacto, donde no caben. */
  body[data-formato=compacto] .etiqueta.opc { display: none; }

  /* ── columna izquierda (completo) ── */
  #izq {
    position: fixed; top: 14px; left: 14px; bottom: 14px; width: 340px;
    display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  }
  #izq > * { pointer-events: auto; }
  #cabecera { padding: 12px 16px 14px; }
  #cabecera .antetitulo { margin: 0 0 2px; }
  #cabecera h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; }
  #cabecera .gancho { margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: var(--tenue); }
  /* 6 columnas, cada cifra ocupa 2; según data-n (lo escribe cifra()) se reparten para que ninguna quede suelta: 1 ancha, 2 y 4 a mitades, 5 → 3 + 2. */
  #cifras { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .cifra { grid-column: span 2; padding: 8px 10px; min-width: 0; }
  #cifras[data-n="1"] .cifra { grid-column: span 6; }
  #cifras[data-n="2"] .cifra, #cifras[data-n="4"] .cifra { grid-column: span 3; }
  #cifras[data-n="5"] .cifra:nth-child(n+4) { grid-column: span 3; }
  #cifras[data-n="4"] .cifra .valor { font-size: 20px; }
  .cifra .valor { display: block; margin-top: 2px; font-size: 22px; font-weight: 600; line-height: 1.15; }
  .cifra .valor small { font-size: 12px; font-weight: 500; color: var(--tenue); margin-left: 3px; }
  .cifra .sub { display: block; font-size: 11px; color: var(--tenue); line-height: 1.3; }
  #tarjeta-relato { padding: 12px 16px; font-size: 14px; line-height: 1.5; }
  #tarjeta-relato b { font-weight: 650; font-variant-numeric: tabular-nums; }
  #caja-grafico { margin-top: auto; padding: 10px 12px 8px; }
  #caja-grafico canvas { display: block; width: 100%; height: 170px; margin-top: 4px; }

  /* ── mandos (arriba a la derecha) ── */
  #mandos { position: fixed; top: 14px; right: 14px; width: 262px; max-height: calc(100% - 28px); overflow-y: auto; padding: 10px 12px 12px; }
  #botones-fijos { display: flex; justify-content: flex-end; gap: 6px; }
  #cuerpo-mandos { margin-top: 8px; }
  #cuerpo-mandos h2 { margin: 14px 0 6px; }
  .grupo { margin: 10px 0; }
  .grupo .rotulo { display: block; margin-bottom: 5px; }
  /* Nunca cortan texto: si no caben en una fila, ajustarGrupos() añade .fil y pasan a rejilla de 2+ filas. */
  .seg { display: flex; gap: 4px; }
  .seg button { flex: 1; white-space: nowrap; }
  .seg.fil { display: grid; grid-template-columns: repeat(var(--c), 1fr); }
  .control { margin: 12px 0; }
  .control label { display: flex; justify-content: space-between; font-size: 13px; color: var(--tenue); }
  .control label b { color: var(--texto); font-weight: 600; font-variant-numeric: tabular-nums; }
  .control input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--acento); }
  .chips, .barra { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  button {
    padding: 6px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; line-height: 1.3;
    background: var(--boton); color: var(--texto); border: 1px solid var(--borde);
  }
  button:hover { background: var(--boton-hover); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  button.activo, button[aria-pressed=true] {
    background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); font-weight: 600;
  }
  .btn-icono { width: 34px; height: 34px; padding: 0; font-size: 16px; }

  /* ── barra inferior (compacto) ── */
  #barra-inferior {
    position: fixed; left: 10px; right: 10px; bottom: 10px; padding: 6px 8px;
    display: flex; align-items: center; gap: 10px;
  }
  #presets-compacto { flex: 0 1 auto; min-width: 0; max-width: 62%; }
  #barra-inferior .grupo { margin: 0; }
  #barra-inferior .grupo .rotulo { display: none; }
  #barra-inferior button { padding: 4px 9px; font-size: 12px; }
  #relato-corto { flex: 1; min-width: 0; font-size: 12px; line-height: 1.35; }
  #relato-corto b { font-weight: 650; }

  /* ── por formato ── */
  body[data-formato=completo] #barra-inferior { display: none; }
  body[data-formato=compacto] #cifras, body[data-formato=compacto] #tarjeta-relato,
  body[data-formato=compacto] #caja-grafico, body[data-formato=compacto] #cuerpo-mandos,
  body[data-formato=compacto] #cabecera .antetitulo, body[data-formato=compacto] #cabecera .gancho { display: none; }
  body[data-formato=compacto] #izq { bottom: auto; width: auto; }
  body[data-formato=compacto] #cabecera { padding: 4px 10px; border-radius: 8px; }
  body[data-formato=compacto] #cabecera h1 { font-size: 13px; }
  body[data-formato=compacto] #mandos {
    top: 10px; right: 10px; width: auto; padding: 0; overflow: visible;
    background: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  body[data-formato=compacto] .btn-icono { width: 28px; height: 28px; font-size: 14px; background: var(--panel); backdrop-filter: blur(6px); }
  body[data-formato=compacto] .btn-icono:hover { background: var(--boton-hover); }

  #ayuda { position: fixed; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 18px; min-width: 240px; max-width: 90%; font-size: 13px; }
  #ayuda h2 { margin: 0 0 8px; }
  #ayuda .nota { margin: 8px 0 0; max-width: 340px; color: var(--tenue); }   /* ayuda(html) */
  #ayuda .arranque { margin: 8px 0 0; font-size: 11px; color: var(--tenue); }   /* «Arrancó en 1,2 s» */
  #ayuda ul { margin: 0; padding: 0; list-style: none; }
  #ayuda li { display: flex; gap: 10px; margin: 3px 0; }
  #ayuda kbd { flex: none; min-width: 22px; text-align: center; padding: 0 5px; border: 1px solid var(--borde); border-radius: 5px; background: var(--boton); font: 12px ui-monospace, Menlo, Consolas, monospace; }
  body[data-formato=compacto] #ayuda { font-size: 12px; padding: 10px 14px; }

  /* ── modo exhibición («Solo la figura») ── */
  /* left/right 0 + margen auto, no left: 50% + translate: con este el ancho disponible sería la mitad de la ventana. */
  #mini { position: fixed; z-index: 4; left: 0; right: 0; margin: 0 auto; bottom: 14px; width: fit-content; max-width: calc(100% - 20px);
          padding: 5px 6px; display: none; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; }
  #mini .grupo { margin: 0; max-width: 100%; }
  #mini .grupo .rotulo { display: none; }
  #mini button { padding: 4px 10px; font-size: 12.5px; }
  #mini .acciones { display: flex; gap: 4px; }
  body[data-exhibicion] #mini { display: flex; }
  body[data-exhibicion] #izq, body[data-exhibicion] #mandos, body[data-exhibicion] #barra-inferior,
  body[data-exhibicion] #etiquetas, body[data-exhibicion] #ayuda { display: none; }

  #fallo {
    position: fixed; inset: 50% auto auto 50%; transform: translate(-50%, -50%); z-index: 9;
    max-width: 620px; padding: 20px 24px; border-radius: 12px; display: none;
    background: #2a1416; border: 1px solid #cc4455; color: #ffd7dc;
  }
  #fallo h2 { margin: 0 0 8px; font-size: 16px; color: #ff8fa0; }
  #fallo code { display: block; margin-top: 10px; padding: 10px; border-radius: 6px;
                background: rgba(0,0,0,.35); font-size: 12.5px; white-space: pre-wrap; }
  #diag { position: fixed; left: -9999px; }   /* lo lee scripts/captura.sh, no se ve */
</style>
</head>
<body data-tema="oscuro" data-formato="completo">

<div id="lienzo"><div id="etiquetas"></div></div>

<div id="izq">
  <header id="cabecera" class="tarjeta">
    <div class="antetitulo rotulo">Geomorfología · Meandros</div>
    <h1>Cómo un río rehace su valle</h1>
    <p class="gancho">Un río de llanura debería bajar recto. Pero cualquier curva pequeña se agranda sola, siglo tras siglo, hasta estrangularse: ¿por qué el agua no la endereza?</p>
  </header>
  <div id="cifras"></div>
  <div id="tarjeta-relato" class="tarjeta" hidden></div>
  <div id="caja-grafico" class="tarjeta" hidden></div>
</div>

<div id="mandos" class="tarjeta">
  <div id="botones-fijos">
    <button id="btn-tema" class="btn-icono" title="Cambiar de tema (t)" aria-label="Cambiar de tema"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8a6.2 6.2 0 0 0 0 12.4z" fill="currentColor"/></svg></button>
    <button id="btn-ayuda" class="btn-icono" title="Ayuda (?)" aria-label="Ayuda">?</button>
    <button id="btn-pantalla" class="btn-icono" title="Pantalla completa (f)" aria-label="Pantalla completa"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button id="btn-exhibicion" class="btn-icono" title="Solo la figura (v)" aria-label="Solo la figura" aria-pressed="false"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 1.6l5.6 3.2v6.4L8 14.4l-5.6-3.2V4.8zM2.4 4.8L8 8l5.6-3.2M8 8v6.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="cuerpo-mandos">
    <div id="controles"></div>
    <h2 class="rotulo">Vista</h2>
    <div id="vistas" class="barra"></div>
  </div>
</div>

<div id="barra-inferior" class="tarjeta">
  <div id="presets-compacto"></div>
  <div id="relato-corto"></div>
</div>

<div id="mini" class="tarjeta" role="toolbar" aria-label="Solo la figura">
  <div class="acciones" id="mini-acciones">
    <button id="mini-vista" title="Volver a la vista inicial (0)">↺ Vista inicial</button>
    <button id="mini-salir" title="Salir de «Solo la figura» (v o Esc)" aria-label="Salir de «Solo la figura»">✕ Salir</button>
  </div>
</div>

<div id="ayuda" class="tarjeta" hidden></div>
<div id="fallo"><h2>La escena no ha podido arrancar</h2><div id="fallo-txt"></div></div>
<div id="diag">sin-arrancar</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>

<script type="module">
// ───────────────────────────────────────────────────────────────────────────
//  ANDAMIAJE — normalmente no hace falta tocarlo. El contenido va más abajo.
// ───────────────────────────────────────────────────────────────────────────
const t0Modulo = performance.now();   // el arranque se mide de aquí al primer fotograma
const diag = document.getElementById('diag');
const caer = (e) => {
  const msg = e?.message || String(e);
  document.getElementById('fallo').style.display = 'block';
  document.getElementById('fallo-txt').innerHTML =
    (/Failed to fetch|dynamically imported|NetworkError|ERR_/i.test(msg)
      ? 'Parece que no se ha podido descargar Three.js desde el CDN. Comprueba la conexión.'
      : 'Ha fallado el guion de la escena.') + `<code>${msg}</code>`;
  diag.textContent = 'ERROR ' + msg;
};
addEventListener('error', (e) => caer(e.error || e));
addEventListener('unhandledrejection', (e) => caer(e.reason));

const THREE = await import('three');
const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
const { CSS2DRenderer, CSS2DObject } = await import('three/addons/renderers/CSS2DRenderer.js');

const $ = (id) => document.getElementById(id);
const url = new URLSearchParams(location.search);
// `?t=` congela el tiempo; `?captura=1` corta el bucle tras unos fotogramas (cierre al final).
const tFijo = url.has('t') ? parseFloat(url.get('t')) : null;
const modoCaptura = url.get('captura') === '1';
if (modoCaptura) document.body.dataset.captura = '';
let exhibicion = url.get('exhibicion') === '1';

// ── Números en formato español ────────────────────────────────────────────
const formatos = {};
function num(v, decimales = 1) {
  const f = formatos[decimales] ??= new Intl.NumberFormat('es-CO',
    { minimumFractionDigits: decimales, maximumFractionDigits: decimales });
  return f.format(v);
}

// ── Temas ─────────────────────────────────────────────────────────────────
// Colores SEMÁNTICOS: la escena pide 'azul' o 'base', nunca un hex. El tema claro va más oscuro para contrastar.
const TEMAS = {
  oscuro: {
    fondo: 0x16181d, suelo: 0x22252c, base: 0x3b414b,
    azul: 0x5aa2ff, naranja: 0xff9f4a, verde: 0x45c48f, rojo: 0xff6b6b,
    amarillo: 0xf2c14e, violeta: 0xa98bff, gris: 0x6f7987, metal: 0xaab3c0,
    hemiCielo: 0xffffff, hemiSuelo: 0x5b6270, hemi: 0.75, sol: 1.7,
  },
  claro: {
    fondo: 0xeceef1, suelo: 0xdde0e5, base: 0xbfc5ce,
    azul: 0x2a6bd1, naranja: 0xd96d16, verde: 0x1b8f5d, rojo: 0xd13a3a,
    amarillo: 0xc99609, violeta: 0x7650d0, gris: 0x9099a6, metal: 0x8d97a4,
    hemiCielo: 0xffffff, hemiSuelo: 0x9aa1ad, hemi: 0.85, sol: 1.5,
  },
};
const clavesPropias = [];
const alCambiarTemaFns = [];
const SEMANTICOS = ['azul', 'naranja', 'verde', 'rojo', 'amarillo', 'violeta', 'gris'];
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
let tema = 'oscuro';
// Mismas claves en los dos temas: un color que solo existe en uno sale `undefined` al conmutar y falla en silencio (material negro).
function ampliarTemas({ claro, oscuro } = {}) {
  if (!claro || !oscuro) throw new Error('ampliarTemas() necesita { claro: {…}, oscuro: {…} }');
  const dif = (a, b, en, falta) => Object.keys(a).filter((k) => !(k in b)).map((k) => `"${k}" está en ${en} y falta en ${falta}`);
  const problemas = [...dif(claro, oscuro, 'claro', 'oscuro'), ...dif(oscuro, claro, 'oscuro', 'claro'),
    ...Object.keys(claro).filter((k) => k in TEMAS.claro).map((k) => `"${k}" ya existe en TEMAS y no se puede pisar (reservadas: ${Object.keys(TEMAS.claro).join(', ')})`)];
  if (problemas.length) throw new Error('ampliarTemas(): ' + problemas.join('; '));
  Object.assign(TEMAS.claro, claro); Object.assign(TEMAS.oscuro, oscuro);
  clavesPropias.push(...Object.keys(claro));
}
function temaInicial() {
  const f = url.get('tema');
  if (f === 'claro' || f === 'oscuro') return f;
  try { const g = localStorage.getItem('lab-tema'); if (g === 'claro' || g === 'oscuro') return g; } catch {}
  return matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
}

// ── Render ────────────────────────────────────────────────────────────────
const contenedor = $('lienzo');
const escena = new THREE.Scene();
escena.fog = new THREE.Fog(0x000000, 28, 55);
const camara = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);

// preserveDrawingBuffer solo en captura: WebGL vacía el lienzo tras componerlo y, al parar el bucle, el PNG saldría negro. Fuera de captura cuesta memoria.
const render = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: modoCaptura });
render.setSize(innerWidth, innerHeight);
render.setPixelRatio(Math.min(devicePixelRatio, 1.5));
render.shadowMap.enabled = true;
render.shadowMap.autoUpdate = false;   // las sombras solo se recalculan cuando algo se mueve
contenedor.appendChild(render.domElement);

const rotulos = new CSS2DRenderer({ element: $('etiquetas') });
rotulos.setSize(innerWidth, innerHeight);
diag.textContent = 'MONTADO three=' + THREE.REVISION;

const orbita = new OrbitControls(camara, render.domElement);
orbita.enableDamping = true;
orbita.dampingFactor = 0.07;
orbita.maxPolarAngle = Math.PI * 0.49;
orbita.minDistance = 3; orbita.maxDistance = 40;

// Hemisférica + sol con sombra, nada más: más luz ambiental aplana la escena.
const hemi = new THREE.HemisphereLight(0xffffff, 0x666666, 0.8);
const sol = new THREE.DirectionalLight(0xffffff, 1.6);
sol.position.set(5, 9, 6);
sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024);
sol.shadow.camera.left = sol.shadow.camera.bottom = -8;     // ajustar al tamaño de la maqueta
sol.shadow.camera.right = sol.shadow.camera.top = 8;
sol.shadow.camera.near = 1; sol.shadow.camera.far = 30;
sol.shadow.radius = 3;
sol.shadow.bias = -0.0005;
escena.add(hemi, sol);

const suelo = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ roughness: 1 }));
suelo.rotation.x = -Math.PI / 2;
suelo.position.y = -0.5;
suelo.receiveShadow = true;
escena.add(suelo);

// Material con color semántico registrado: al cambiar de tema se recolorean todos.
const materiales = [];
function mat(clave, opciones = {}) {
  const m = new THREE.MeshStandardMaterial({
    roughness: 0.8, metalness: 0.05,
    ...(clave === 'metal' ? { roughness: 0.5, metalness: 0.3 } : {}),   // sin mapa de entorno, más metalness sale negro
    ...opciones, color: TEMAS[tema][clave],
  });
  materiales.push([m, clave]);
  return m;
}
suelo.material = mat('suelo', { roughness: 1 });

let coloresUI = null;   // se invalida en aplicarTema(): el gráfico lo pide en cada repintado
function colorUI() {
  if (coloresUI) return coloresUI;
  const s = getComputedStyle(document.body);
  const c = { texto: s.getPropertyValue('--texto').trim(), tenue: s.getPropertyValue('--tenue').trim(),
              borde: s.getPropertyValue('--borde').trim(), fondo: hex(TEMAS[tema].fondo) };
  for (const k of [...SEMANTICOS, ...clavesPropias]) c[k] = hex(TEMAS[tema][k]);
  return coloresUI = c;
}
function aplicarTema(nuevo, guardar = false) {
  tema = nuevo; coloresUI = null;
  const T = TEMAS[tema];
  document.body.dataset.tema = tema;
  for (const k of SEMANTICOS) document.body.style.setProperty('--c-' + k, hex(T[k]));
  escena.background = new THREE.Color(T.fondo);
  escena.fog.color.setHex(T.fondo);
  hemi.color.setHex(T.hemiCielo); hemi.groundColor.setHex(T.hemiSuelo);
  hemi.intensity = T.hemi; sol.intensity = T.sol;

      const rr1 = s.r[i] + (s.r[i + 1] - s.r[i]) * tc;
      const ex = Math.max(-0.9, Math.min(0.9, A_SOC * Cc * nn));   // + hacia la orilla exterior
      if (ae <= 1.2) {
        const f = 1 + ex;
        const h = ae <= 1 ? -0.3 - DBF * (1 - ae * ae * ae * ae) * f : -0.3 * (1 - (ae - 1) / 0.2);
        if (h < hT[c]) { hT[c] = h; rework[c] = 1; }
        if (ae < mejorEta[c]) {   // el tramo más cercano manda en la dirección y la rapidez
          mejorEta[c] = ae;
          flujo[4 * c] = Math.round((ux / ul * 0.5 + 0.5) * 255); flujo[4 * c + 1] = Math.round((uy / ul * 0.5 + 0.5) * 255);
          const v = Math.max(0, 1 - 0.55 * ae * ae) * (1 + 0.9 * ex);   // más rápido por fuera, más lento sobre la barra
          flujo[4 * c + 2] = Math.round(Math.min(1, v * 0.55) * 255);
        }
      }
      if (ae >= 0.9 && ae <= 2.2 && Math.sign(nn) === Math.sign(rr1) && Math.abs(rr1) > 0.25)
        tinte[c] = Math.max(tinte[c], Math.min(1, (Math.abs(rr1) - 0.25) / 1.1) * (1 - (ae - 0.9) / 1.3));
    }
  }
  // 3. un paso de suavizado de alturas: quita los dientes de la rejilla en las orillas empinadas
  hTmp.set(hT);
  for (let j = 1; j < NZ - 1; j++) for (let i = 1; i < NX - 1; i++) {
    const c = j * NX + i;
    hT[c] = (4 * hTmp[c] + hTmp[c - 1] + hTmp[c + 1] + hTmp[c - NX] + hTmp[c + NX]) / 8;
  }
  for (let pasada = 0; pasada < 2; pasada++) {   // en el cauce, dos pasadas más: allí la orilla cae varios metros en una celda
    hTmp.set(hT);
    for (let j = 1; j < NZ - 1; j++) for (let i = 1; i < NX - 1; i++) {
      const c = j * NX + i;
      if (rework[c] === 1) hT[c] = (4 * hTmp[c] + hTmp[c - 1] + hTmp[c + 1] + hTmp[c - NX] + hTmp[c + NX]) / 8;
    }
  }
  // 4. alturas, profundidad del agua y color del suelo
  for (let c = 0; c < NC; c++) {
    const h = hT[c], edad = edadT[c], rw = rework[c];
    posT[3 * c + 1] = wy(h);
    flujo[4 * c + 3] = Math.round(Math.max(0, Math.min(1, (NIVEL - h) / 8)) * 255);
    const claro = claros[c] < -0.2;
    if (h < NIVEL + 0.1) _c.setHex(rw === 3 ? C.fango : C.lecho);
    else if (rw === 1 && tinte[c] > 0) _c.setHex(C.humus);                    // la orilla que cede: tierra desnuda
    else if (rw === 1 || rw === 4) _c.setHex(C.arena);                         // barra y orillas del cauce, tapones del lago
    else if (rw === 3) _c.setHex(C.pantano);
    else if (edad < 0) _c.setHex(claro ? C.pasto : C.sotobosque).offsetHSL(0, 0, ruido[c] * 0.06);
    else {
      if (edad < 12) _c.setHex(C.arena);
      else if (edad < 60) _c.setHex(C.arena).lerp(_d.setHex(C.prado), (edad - 12) / 48);
      else _c.setHex(C.prado).lerp(_d.setHex(C.sotobosque), Math.min(1, (edad - 60) / 260));
      if (edad > 20 && edad % 100 < 7) _c.multiplyScalar(0.86);   // isócronas: la orilla hace 100, 200… años
    }
    if (tinte[c] > 0) {
      _c.lerp(_d.setHex(C.humus), Math.min(1, tinte[c] * 1.6));   // suelo desnudo donde la orilla se derrumba
      if (est.tinte) _c.lerp(_d.setHex(C.rojo), tinte[c] * 0.6);
    }

  texFlujo.needsUpdate = true;

  bordes.forEach((c, k) => {

    const dep = rework[c] ? Math.min(DEP, hT[c]) : hT[c];
    topF[2 * k] = topF[2 * k + 1] = hT[c]; depF[2 * k] = depF[2 * k + 1] = dep;
  });
  geoF.attributes.position.needsUpdate = geoF.attributes.aTop.needsUpdate = geoF.attributes.aDep.needsUpdate = true;
  geoF.computeVertexNormals();
  // 6. talud: tramos de la orilla exterior que retroceden
  let nq = 0;
  const altoEn = (x, y) => {
    const ii = Math.round((x - P.VX0) / CEL), jj = Math.round((y - P.VZ0) / CEL);
    return ii < 0 || jj < 0 || ii >= NX || jj >= NZ ? null : jj * NX + ii;
  };
  for (let i = 2; i < n - 3 && nq < MAXT; i++) {
    if (Math.abs(s.r[i]) < 0.3 || Math.abs(s.r[i + 1]) < 0.3 || Math.sign(s.r[i]) !== Math.sign(s.r[i + 1])) continue;
    if (!dentro(s.x[i], s.y[i], 8) || !dentro(s.x[i + 1], s.y[i + 1], 8)) continue;
    const pts = [i, i + 1].map((k) => {
      const [nx, ny] = normalDer(s, k), sg = Math.sign(s.r[k]);
      const cb = altoEn(s.x[k] + nx * sg * R * 1.45, s.y[k] + ny * sg * R * 1.45);
      const top = cb === null ? 0 : Math.max(hT[cb], -1) + 0.05;
      return { x: wx(s.x[k] + nx * sg * R * 0.98), z: wz(s.y[k] + ny * sg * R * 0.98), top, dep: cb !== null && rework[cb] ? Math.min(DEP, top) : top };
    });
    const [a, b] = pts, yb = wy(NIVEL - 0.3);
    const v = [[a.x, wy(a.top), a.z, a], [a.x, yb, a.z, a], [b.x, wy(b.top), b.z, b], [b.x, wy(b.top), b.z, b], [a.x, yb, a.z, a], [b.x, yb, b.z, b]];
    v.forEach(([x, y, z, p], k) => { const o = nq * 6 + k; posTal.set([x, y, z], 3 * o); topTal[o] = p.top; depTal[o] = p.dep; });
    nq++;
  }
  geoTal.setDrawRange(0, nq * 6);
  geoTal.attributes.position.needsUpdate = geoTal.attributes.aTop.needsUpdate = geoTal.attributes.aDep.needsUpdate = true;
  geoTal.computeVertexNormals();
  // 7. vegetación según la edad del suelo (máscaras: agua, cauce, lago, pendiente, orilla que cede, campo)
  let nv = 0;
  for (const k of cand) {
    const c = k.c, h = hT[c], edad = edadT[c], rw = rework[c];
    if (h < NIVEL + 0.5 || rw === 1 || rw === 3 || rw === 4 || tinte[c] > 0 || enCampo(k.x, k.y)) continue;
    const i = c % NX, j = (c - i) / NX;
    if (i > 0 && j > 0 && i < NX - 1 && j < NZ - 1 && Math.max(Math.abs(hT[c + 1] - hT[c - 1]), Math.abs(hT[c + NX] - hT[c - NX])) > 1.2) continue;
    let dens, tam, madurez;
    if (edad < 0) { dens = claros[c] < -0.2 ? 0.05 : 0.9; tam = 1; madurez = 1; }
    else if (edad < 15) continue;
    else {
      const cresta = 0.5 + 0.5 * Math.cos(edad / 30 * 6.283);
      madurez = Math.min(0.65, (edad - 15) / 300);   // el bosque sobre suelo del río nunca llega al tono del bosque viejo en 1500 años
      dens = Math.min(0.9, (edad - 15) / 90) * (0.35 + 0.65 * cresta);
      tam = 0.4 + 0.6 * madurez;
    }
    if (k.a > dens) continue;
    const t = tam * (0.8 + 0.4 * k.b), d = 0.13 * t, alto = 0.16 * t;
    _m.compose(_v.set(wx(k.x), wy(h) - 0.005, wz(k.y)), _q, _s.set(d, alto, d));
    copas.setMatrixAt(nv, _m);
    _c.setHex(madurez < 0.25 ? C.arbusto : C.copaJoven).lerp(_d.setHex(C.copaVieja), madurez < 0.25 ? 0 : madurez).offsetHSL(0, 0, (k.b - 0.5) * 0.08);
    copas.setColorAt(nv, _c);
    nv++;
  }
  copas.count = nv;
  copas.instanceMatrix.needsUpdate = true; copas.instanceColor.needsUpdate = true;
  copas.computeBoundingSphere();
  // 8. flechas de migración
  flechas.forEach((g, k) => {
    const i = an.flechas[k];
    g.visible = i !== undefined && estado.migracion;
    if (!g.visible) return;
    const [nx, ny] = normalDer(s, i), sg = Math.sign(s.r[i]), r = Math.abs(s.r[i]);
    const bx = s.x[i] + nx * sg * (R + 12), by = s.y[i] + ny * sg * (R + 12);
    g.position.set(wx(bx), 0.1, wz(by));
    g.rotation.y = -Math.atan2(ny * sg, nx * sg);
    g.largo(0.25 + 0.32 * r);
  });

  const ia = an.iApex >= 0 ? an.iApex : an.iMax;
  est.iCorte = Math.max(2, Math.min(NX - 3, Math.round((s.x[ia] - P.VX0) / CEL)));
  est.xCorte = wx(P.VX0 + est.iCorte * CEL);
  est.zCruce = s.y[ia];
  planoCorte.constant = est.xCorte;
  if (est.corte) construirSeccion();
  marcarSombras();
}
// el campo, sobre el suelo del claro (la llanura vieja no cambia)
{ const c = Math.round((CAMPO.y - P.VZ0) / P.CELDA) * NX + Math.round((CAMPO.x - P.VX0) / P.CELDA); campo.position.set(wx(CAMPO.x), wy(ruido[c] * 0.6) + 0.02, wz(CAMPO.y)); }

function construirSeccion() {
  const i = est.iCorte, x = est.xCorte + 0.004, yN = wy(NIVEL);
  const pa = geoSA.attributes.position.array;
  let v = 0, pmin = { h: 0, j: 0 };
  const cruce = Math.round((est.zCruce - P.VZ0) / P.CELDA);
  for (let j = 0; j < NZ; j++) {
    const c = j * NX + i, z = wz(P.VZ0 + j * P.CELDA), y = posT[3 * c + 1];
    posS.set([x, y, z, x, YB, z], 6 * j);
    const dep = rework[c] ? Math.min(DEP, hT[c]) : hT[c];
    topS[2 * j] = topS[2 * j + 1] = hT[c]; depS[2 * j] = depS[2 * j + 1] = dep;
    if (j < NZ - 1) {
      const y1 = posT[3 * (c + NX) + 1], z1 = wz(P.VZ0 + (j + 1) * P.CELDA);
      const a0 = Math.min(y, yN), a1 = Math.min(y1, yN);
      for (const [zz, yy] of [[z, a0], [z1, a1], [z, yN], [z, yN], [z1, a1], [z1, yN]]) { pa[3 * v] = x + 0.002; pa[3 * v + 1] = yy; pa[3 * v + 2] = zz; v++; }
    }
    if (Math.abs(j - cruce) < 14 && hT[c] < pmin.h) pmin = { h: hT[c], j };
  }

  geoS.computeVertexNormals(); geoS.computeBoundingSphere();
  geoSA.attributes.position.needsUpdate = true; geoSA.computeVertexNormals(); geoSA.computeBoundingSphere();

// ── Etiquetas ──
const ancla = () => { const o = new THREE.Object3D(); escena.add(o); return o; };
const aOrilla = ancla(), aBarra = ancla(), aLago = ancla(), aIni = ancla(), aCampo = ancla(), aPoza = ancla();
const etOrilla = etiqueta(aOrilla, (e) => `Orilla exterior · ${num(analisis(e.anios).rMax, 1)} m/año`, { color: 'rojo', lado: 'der', prioridad: 1 });
const etBarra = etiqueta(aBarra, (e) => `Barra de meandro · +${num(analisis(e.anios).rMax, 1)} m/año`, { color: 'amarillo', lado: 'izq', prioridad: 1 });
const etLago = etiqueta(aLago, (e) => `Lago en herradura · ${analisis(e.anios).ultimo?.anio ?? ''}`, { color: 'azul', lado: 'der', prioridad: 1 });
const etIni = etiqueta(aIni, 'Cauce del año 0', { color: 'gris', opcional: true, lado: 'izq' });

function colocarEtiquetas(anio) {
  const an = analisis(anio), s = an.s;
  const i = est.corte ? (an.iApex >= 0 ? an.iApex : an.iMax) : an.iMax;
  if (i > 0) {
    const [nx, ny] = normalDer(s, i), sg = Math.sign(s.r[i]) || 1;
    if (est.corte) {
      aOrilla.position.set(est.xCorte, 0.02, wz(s.y[i] + ny * sg * (W / 2 + 6)));
      aBarra.position.set(est.xCorte, 0.02, wz(s.y[i] - ny * sg * (W / 2 + 6)));
    } else {
      aOrilla.position.set(wx(s.x[i] + nx * sg * (W / 2 + 70)), 0.05, wz(s.y[i] + ny * sg * (W / 2 + 70)));
      aBarra.position.set(wx(s.x[i] - nx * sg * (W / 2 + 40)), 0.05, wz(s.y[i] - ny * sg * (W / 2 + 40)));
    }
    // cada etiqueta hacia su lado de la curva en pantalla: en planta la derecha es +x; en la sección, −z
    const fueraDer = est.corte ? sg * ny < 0 : sg * nx > 0;
    const hacia = (a, der) => (!est.corte && Math.abs(a.position.x) > ANCHO * 0.28 ? a.position.x < 0 : der);   // cerca de un borde: hacia dentro
    const dO = hacia(aOrilla, fueraDer), dB = hacia(aBarra, !fueraDer);
    // si acaban del mismo lado, una encima y otra debajo del ancla para que no se pisen
    const arriba = aOrilla.position.z < aBarra.position.z;
    etOrilla.center.set(dO ? -0.1 : 1.1, dO === dB ? (arriba ? 1.3 : -0.3) : 0.5);
    etBarra.center.set(dB ? -0.1 : 1.1, dO === dB ? (arriba ? -0.3 : 1.3) : 0.5);
  }
  etOrilla.visible = etBarra.visible = i > 0;
  const L = an.ultimo;
  etLago.visible = !est.corte && !!L && an.anio - L.anio < TRELLENO;
  if (L) {   // el punto del lazo, dentro del bloque, más lejos del cuello
    let m = -1, dm = -1;
    for (let k = 0; k < L.x.length; k++) {
      if (!dentro(L.x[k], L.y[k], 80)) continue;
      const d = Math.hypot(L.x[k] - L.x[0], L.y[k] - L.y[0]);
      if (d > dm) { dm = d; m = k; }
    }
    if (m >= 0) { aLago.position.set(wx(L.x[m]), 0.05, wz(L.y[m])); etLago.center.set(aLago.position.x > ANCHO * 0.2 ? 1.1 : -0.1, 0.5); }

  etPoza.visible = est.corte && !!est.poza;
  if (est.poza) aPoza.position.set(est.xCorte, est.poza.y, est.poza.z);
}

});

  SIM.snaps.forEach((s, k) => (k ? ctx.lineTo(X(s.anio), Y(s.sin)) : ctx.moveTo(X(s.anio), Y(s.sin))));
  ctx.stroke();
  const a = analisis(e.anios);
  ctx.strokeStyle = c.tenue; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(X(a.anio), sup); ctx.lineTo(X(a.anio), sup + al); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = c.rojo; ctx.beginPath(); ctx.arc(X(a.anio), Y(a.sin), 4.5, 0, 7); ctx.fill();
});

VISTAS = {
  inicial: { pos: [0.6, 12.1, 12.1], mira: [0.3, -0.6, 0.6] },
  mapa:    { pos: [0, 19, 0.01], mira: [0, 0, 0] },
};
ASPECTO_BASE = 1.75;
ayuda('Relieve exagerado ×6 (los árboles no). Agua a caudal medio, 2 m bajo la llanura. Modelo de Howard y Knutson (1984): ancho, profundidad y caudal fijos; llanura homogénea.');


// ───────────────────────────────────────────────────────────────────────────
//  BUCLE
// ───────────────────────────────────────────────────────────────────────────
aplicarTema(temaInicial());
if (exhibicion) { document.body.dataset.exhibicion = ''; $('btn-exhibicion').setAttribute('aria-pressed', 'true'); }
for (const clave of vistasVisibles()) {
  const b = el('button'); b.textContent = clave[0].toUpperCase() + clave.slice(1); b.dataset.vista = clave;
  b.addEventListener('click', () => mirarDesde(clave));
  $('vistas').append(b);
}
// Pausa: el botón (panel y mini barra) solo se muestra mientras ANIMADA sea true; sincronizarPausa() lo comprueba cada vuelta.
const bPausa = el('button'), bPausaMini = el('button');
const rotuloPausa = () => { bPausa.textContent = bPausaMini.textContent = pausado ? '▶ Reanudar' : '⏸ Pausa'; };
rotuloPausa();
bPausa.addEventListener('click', () => { pausado = !pausado; rotuloPausa(); pedirFotograma(); });
bPausaMini.addEventListener('click', () => bPausa.click());
$('vistas').before(bPausa);
$('mini-acciones').prepend(bPausaMini);
atajos.push({ tecla: ' ', texto: 'Pausa', activo: () => ANIMADA, fn: () => { if (ANIMADA) bPausa.click(); } });
let animadaVista = null;
function sincronizarPausa() {
  if (ANIMADA === animadaVista) return;
  if (animadaVista === false && ANIMADA && pausado) { pausado = false; rotuloPausa(); }
  animadaVista = ANIMADA;
  bPausa.hidden = bPausaMini.hidden = !ANIMADA;
  pedirFotograma();
}
actualizarFormato();
refrescar();
sincronizarPausa();   // tras refrescar(): la escena suele fijar ANIMADA en alCambiar, y el estado inicial no cuenta como cambio
// Prioridad: ?vista=, la que la escena eligió al arrancar (mirarDesde en alCambiar), la inicial.
mirarDesde(VISTAS[url.get('vista')] ? url.get('vista') : VISTAS[vistaActual] ? vistaActual : vistaBase());
arrancado = true;

const reloj = new THREE.Clock();
let fotogramas = 0;
render.setAnimationLoop(() => {
  const dt = reloj.getDelta();
  sincronizarPausa();
  let dibujar = pedido;
  if (ANIMADA && (!pausado || pedido)) {
    if (!pausado) t += dt;
    actualizar(t, estado);
    seguirTexto();
    dibujar = true;
    if (SOMBRAS_ANIMADAS) sombrasSucias = true;
  }
  if (avanzarTransiciones()) sombrasSucias = dibujar = true;
  if (orbita.update()) dibujar = true;
  if (modoCaptura && fotogramas < 3) dibujar = true;
  if (!dibujar) return;
  pedido = false;
  if (sombrasSucias) { render.shadowMap.needsUpdate = true; sombrasSucias = false; }
  render.render(escena, camara);
  rotulos.render(escena, camara);
  resolverEtiquetas();
  fotogramas++;

  if (fotogramas === 1) {
    arranqueMs = Math.round(performance.now() - t0Modulo);
    diagOK = `OK three=${THREE.REVISION} objetos=${escena.children.length} ` +
      `triangulos=${render.info.render.triangles} llamadas=${render.info.render.calls} ` +
      `formato=${document.body.dataset.formato} tema=${document.body.dataset.tema} arranque=${arranqueMs}`;
    medirTexto();
    document.body.dataset.listo = '1';
  }
  // Cierre del modo captura, no simplificar: con el bucle vivo el headless no da la página por terminada, y cortarlo a secas deja
  // un PNG negro con las etiquetas flotando (el compositor fotografía antes de llevar a pantalla lo que WebGL dibujó).
  // Congelar el lienzo en un <img> quita la carrera: una imagen normal siempre se pinta.
  if (modoCaptura && fotogramas === 3) {
    render.setAnimationLoop(null);
    const foto = new Image();
    foto.src = render.domElement.toDataURL('image/png');   // exige preserveDrawingBuffer
    foto.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
    render.domElement.replaceWith(foto);
  }
});
</script>
